name: Build and Release

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link
          (Get-Content .env) -replace 'APP_NAME=.*', 'APP_NAME=DevelTodo' | Set-Content .env
          Add-Content .env "`nNATIVEPHP_APP_NAME=DevelTodo"
          Add-Content .env "NATIVEPHP_APP_ID=com.develtodo.app"
          Add-Content .env "NATIVEPHP_APP_VERSION=1.0.0"
          Add-Content .env "NATIVEPHP_APP_AUTHOR=DevelTodo"
          Add-Content .env "NATIVEPHP_APP_COPYRIGHT=`"(c) 2026 DevelTodo`""
          Add-Content .env "NATIVEPHP_APP_DESCRIPTION=`"Todo e gestionale per web developer`""
        shell: pwsh

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Build electron plugin (TypeScript)
        shell: pwsh
        run: |
          Write-Host "Building electron-plugin..."
          Set-Location nativephp\electron\electron-plugin
          npm install --silent 2>&1 | Out-Null
          npx tsc --project tsconfig.json 2>&1 | Out-Null
          if (Test-Path "dist\index.js") { Write-Host "dist/index.js OK" } else { Write-Host "WARNING: dist/index.js not found" }
          Set-Location ..\..\..

      - name: Build native app (Windows x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NATIVEPHP_APP_NAME: "DevelTodo"
          NATIVEPHP_APP_FILENAME: "develtodo"
        run: php artisan native:build win --no-interaction

      - name: Find installer and exe
        shell: pwsh
        run: |
          Write-Host "=== Searching for setup/installer ==="
          Get-ChildItem -Path "nativephp" -Recurse -Filter "*setup*" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Found: $($_.FullName) - Size: $($_.Length) bytes"
          }
          Write-Host "=== dist folder ==="
          if (Test-Path "nativephp\electron\dist") {
            Get-ChildItem -Path "nativephp\electron\dist" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "$($_.Name) - $($_.Length) bytes"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-windows
          path: nativephp\electron\dist\
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link
          sed -i '' 's/APP_NAME=.*/APP_NAME=DevelTodo/' .env
          echo "NATIVEPHP_APP_NAME=DevelTodo" >> .env
          echo "NATIVEPHP_APP_ID=com.develtodo.app" >> .env
          echo "NATIVEPHP_APP_VERSION=1.0.0" >> .env
          echo "NATIVEPHP_APP_AUTHOR=DevelTodo" >> .env
          echo 'NATIVEPHP_APP_COPYRIGHT="(c) 2026 DevelTodo"' >> .env
          echo 'NATIVEPHP_APP_DESCRIPTION="Todo e gestionale per web developer"' >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Build electron plugin (TypeScript)
        run: |
          echo "Building electron-plugin..."
          cd nativephp/electron/electron-plugin
          npm install --silent 2>/dev/null || true
          npx tsc --project tsconfig.json 2>&1 || true
          if [ -f "dist/index.js" ]; then echo "dist/index.js OK"; else echo "WARNING: dist/index.js not found"; fi
          cd ../../..

      - name: Build native app (macOS arm64)
        env:
          NATIVEPHP_APP_NAME: "DevelTodo"
          NATIVEPHP_APP_FILENAME: "develtodo"
        run: php artisan native:build mac --no-interaction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-macos
          path: nativephp/electron/dist/
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxkbfile-dev libsecret-1-dev libarchive-tools rpm

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link
          sed -i 's/APP_NAME=.*/APP_NAME=DevelTodo/' .env
          echo "NATIVEPHP_APP_NAME=DevelTodo" >> .env
          echo "NATIVEPHP_APP_ID=com.develtodo.app" >> .env
          echo "NATIVEPHP_APP_VERSION=1.0.0" >> .env
          echo "NATIVEPHP_APP_AUTHOR=DevelTodo" >> .env
          echo 'NATIVEPHP_APP_COPYRIGHT="(c) 2026 DevelTodo"' >> .env
          echo 'NATIVEPHP_APP_DESCRIPTION="Todo e gestionale per web developer"' >> .env

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --no-interaction

      - name: Build electron plugin (TypeScript)
        run: |
          echo "Building electron-plugin..."
          cd nativephp/electron/electron-plugin
          npm install --silent 2>/dev/null || true
          npx tsc --project tsconfig.json 2>&1 || true
          if [ -f "dist/index.js" ]; then echo "dist/index.js OK"; else echo "WARNING: dist/index.js not found"; fi
          cd ../../..

      - name: Build native app (Linux x64)
        env:
          NATIVEPHP_APP_NAME: "DevelTodo"
          NATIVEPHP_APP_FILENAME: "develtodo"
        run: php artisan native:build linux --no-interaction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-linux
          path: nativephp/electron/dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Display artifacts
        run: find dist/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: true
