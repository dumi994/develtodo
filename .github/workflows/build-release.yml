name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link
          # Imposta il nome app corretto
          (Get-Content .env) -replace 'APP_NAME=.*', 'APP_NAME=DevelTodo' | Set-Content .env
          Add-Content .env "`nNATIVEPHP_APP_NAME=DevelTodo"
          Add-Content .env "NATIVEPHP_APP_ID=com.develtodo.app"
          Add-Content .env "NATIVEPHP_APP_VERSION=1.0.0"
          Add-Content .env "NATIVEPHP_APP_AUTHOR=DevelTodo"
          Add-Content .env "NATIVEPHP_APP_COPYRIGHT=(c) 2026 DevelTodo"
          Add-Content .env "NATIVEPHP_APP_DESCRIPTION=Todo e gestionale per web developer"
        shell: pwsh

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --force --quiet --no-interaction

      - name: Build native app (Windows x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
          NATIVEPHP_APP_NAME: "DevelTodo"
          NATIVEPHP_APP_FILENAME: "develtodo"
        shell: pwsh
        run: |
          # Passa le risposte interattive: 0=win, 0=x64
          "0`n0" | php artisan native:build

      - name: Find installer and exe
        shell: pwsh
        run: |
          Write-Host "=== Searching for setup/installer ==="
          Get-ChildItem -Path "nativephp" -Recurse -Filter "*setup*" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Found: $($_.FullName) - Size: $($_.Length) bytes"
          }
          Get-ChildItem -Path "nativephp" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "EXE: $($_.FullName) - Size: $($_.Length) bytes"
          }
          Write-Host "=== dist folder ==="
          if (Test-Path "nativephp\electron\dist") {
            Get-ChildItem -Path "nativephp\electron\dist" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "$($_.Name) - $($_.Length) bytes"
            }
          }

      - name: Zip the app
        shell: pwsh
        run: |
          # Cerca develtodo.exe o qualsiasi exe che non sia php.exe/hiddeninput.exe
          $exe = Get-ChildItem -Path "nativephp" -Recurse -Filter "develtodo.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path "nativephp" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin @("php.exe","hiddeninput.exe","windows-kill.exe") } | Select-Object -First 1
          }
          if ($exe) {
            $appDir = $exe.DirectoryName
            Write-Host "Found app exe: $($exe.FullName) - Size: $($exe.Length) bytes"
            Write-Host "Zipping app from: $appDir"
            Compress-Archive -Path "$appDir\*" -DestinationPath "develtodo-windows-x64.zip" -Force
          } elseif (Test-Path "nativephp\electron\dist\win-unpacked") {
            Write-Host "Zipping win-unpacked folder"
            Compress-Archive -Path "nativephp\electron\dist\win-unpacked\*" -DestinationPath "develtodo-windows-x64.zip" -Force
          } else {
            Write-Host "ERROR: No app folder found!"
            Get-ChildItem "nativephp\electron\dist" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName, Length
            exit 1
          }
          $zipSize = (Get-Item "develtodo-windows-x64.zip").Length
          Write-Host "Zip created: develtodo-windows-x64.zip - Size: $zipSize bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-windows-x64
          path: develtodo-windows-x64.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: develtodo-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
