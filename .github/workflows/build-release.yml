name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --force --quiet --no-interaction

      - name: Build native app (Windows x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
        run: php artisan native:build win x64 --no-interaction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-windows-x64
          path: nativephp/electron/dist/win-unpacked/
          retention-days: 30

      - name: Find and zip exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path nativephp/electron/dist -Recurse -Filter "develtodo.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Found exe: $($exe.FullName)"
            Compress-Archive -Path "$($exe.DirectoryName)/*" -DestinationPath "develtodo-windows-x64.zip"
            Write-Host "Zip created"
          } else {
            Write-Host "No exe found, zipping entire dist"
            Compress-Archive -Path "nativephp/electron/dist/win-unpacked/*" -DestinationPath "develtodo-windows-x64.zip"
          }

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            develtodo-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --force --quiet --no-interaction

      - name: Build native app (Linux x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: php artisan native:build linux x64 --no-interaction

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-linux-x64
          path: nativephp/electron/dist/linux-unpacked/
          retention-days: 30
