name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, ctype, json, bcmath, pdo, sqlite, pdo_sqlite, fileinfo, zip, curl, openssl, gd
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan storage:link

      - name: Run migrations
        run: php artisan migrate --force

      - name: Install NativePHP
        run: php artisan native:install --force --quiet --no-interaction

      - name: Build native app (Windows x64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""
        shell: pwsh
        run: |
          # Passa le risposte interattive: 0=win, 0=x64
          "0`n0" | php artisan native:build

      - name: Debug - Find all exe files
        shell: pwsh
        run: |
          Write-Host "=== Searching for exe files ==="
          Get-ChildItem -Path "nativephp" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Found: $($_.FullName) - Size: $($_.Length) bytes"
          }
          Write-Host "=== dist folder contents ==="
          if (Test-Path "nativephp\electron\dist") {
            Get-ChildItem -Path "nativephp\electron\dist" -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "$($_.FullName) - $($_.Length) bytes"
            }
          } else {
            Write-Host "dist folder does not exist!"
          }

      - name: Zip the app
        shell: pwsh
        run: |
          # Cerca la cartella win-unpacked o qualsiasi cartella con develtodo.exe
          $exe = Get-ChildItem -Path "nativephp" -Recurse -Filter "develtodo.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $appDir = $exe.DirectoryName
            Write-Host "Zipping app from: $appDir"
            Compress-Archive -Path "$appDir\*" -DestinationPath "develtodo-windows-x64.zip" -Force
          } elseif (Test-Path "nativephp\electron\dist\win-unpacked") {
            Write-Host "Zipping win-unpacked folder"
            Compress-Archive -Path "nativephp\electron\dist\win-unpacked\*" -DestinationPath "develtodo-windows-x64.zip" -Force
          } else {
            Write-Host "ERROR: No app folder found!"
            dir nativephp\electron\dist -Recurse
            exit 1
          }
          Write-Host "Zip size:"
          (Get-Item "develtodo-windows-x64.zip").Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: develtodo-windows-x64
          path: develtodo-windows-x64.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: develtodo-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
